[project]
name = "football-quant-engine"
version = "0.2.0"
description = "Deterministic football probability and market-disagreement research engine"
requires-python = ">=3.11"
dependencies = [
    "httpx==0.27.0",
    "numpy==1.26.4",
    "scipy==1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.0.2",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests/research"]
pythonpath = ["."]

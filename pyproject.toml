[project]
name = "football-quant-engine"
version = "0.1.0"
description = "Over/Under football sports analytics engine with walk-forward backtesting"
requires-python = ">=3.11"
dependencies = [
    "httpx==0.27.0",
    "numpy==1.26.4",
    "scipy==1.12.0",
    "pydantic==2.6.1",
    "pandas==2.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.0.2",
    "pytest-asyncio==0.23.5",
    "hypothesis==6.*",
]
api = [
    "fastapi==0.109.2",
    "uvicorn==0.27.1",
]
bedrock = [
    # Pinned to a build whose bedrock-runtime service model exposes BOTH the
    # Converse and CountTokens operations required by the Item 6 Stage-1 live
    # transport. boto3/botocore 1.34.69 predate CountTokens (and 1.34.46 predates
    # Converse), which is what forced the earlier zero-spend execution stop. The
    # capability is asserted programmatically from the constructed client's service
    # model at driver preflight, not from these version strings alone.
    "boto3==1.43.93",
    "botocore==1.43.93",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
